name: Deploy EasyDesign photoreal renderer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "easydesign-photoreal/**"
      - ".github/workflows/deploy-easydesign-render.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easydesign-photoreal
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: easydesign-photoreal
          command: deploy
          secrets: |
            OPENAI_API_KEY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
